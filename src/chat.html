<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Online Brain</title>
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">AI Online Brain</span>
      <div class="bar-actions">
        <button id="popout" class="icon-btn" title="Abrir en ventana flotante">⧉</button>
        <button id="clear" class="icon-btn" title="Nueva conversación">✕</button>
        <button id="toggle-settings" class="icon-btn" title="Ajustes">⚙</button>
      </div>
    </header>

    <section id="settings" class="settings" hidden>
      <label for="api-key">Clave de API de Anthropic</label>
      <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off" />
      <label for="model">Modelo</label>
      <select id="model">
        <option value="claude-opus-5">Claude Opus 5</option>
        <option value="claude-sonnet-5">Claude Sonnet 5</option>
        <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
      </select>
      <p class="hint">
        La clave se guarda solo en este navegador (<code>chrome.storage.local</code>) y se
        envía únicamente a <code>api.anthropic.com</code>.
      </p>
      <button id="save-settings" class="primary">Guardar</button>
    </section>

    <main id="log" class="log" aria-live="polite"></main>

    <footer class="composer">
      <label class="ctx">
        <input id="use-page" type="checkbox" />
        Usar el contenido de la pestaña actual
      </label>
      <div class="input-row">
        <textarea
          id="input"
          rows="1"
          placeholder="Escribe un mensaje…"
          title="Enter envía · Shift+Enter salta de línea"
        ></textarea>
        <button id="send" class="primary send">Enviar</button>
      </div>
    </footer>

    <script type="module" src="chat.js"></script>
  </body>
</html>
